<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>釜山慶州 5D4N 秋季自由行</title>
  
  <!-- 引入 Google 字體與 Phosphor Icons 向量圖示庫 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      /* 🍁 秋季專屬調色盤 */
      --primary: #c2410c;       /* 楓葉橘紅 */
      --primary-light: #ffedd5; /* 暖米黃色 */
      --accent: #b45309;        /* 銀杏深黃 */
      --bg: #faf6f0;            /* 溫暖燕麥米白底色 */
      --surface: #ffffff;
      --text: #292524;          /* 暖深灰色 */
      --text-muted: #78716c;    /* 暖淺灰色 */
      --border: #e7e5e4;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 100px;
    }

    /* 動態頂部英雄封面 - 秋季暖色漸層 */
    .hero {
      position: relative;
      height: 260px;
      background-color: #432416;
      overflow: hidden;
      border-bottom-left-radius: var(--radius-lg);
      border-bottom-right-radius: var(--radius-lg);
      box-shadow: 0 10px 30px rgba(194, 65, 12, 0.15);
    }
    .hero-img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      transition: opacity 0.5s ease, transform 0.8s ease; opacity: 0;
    }
    .hero-img.active { opacity: 0.85; transform: scale(1.05); }
    .hero-overlay {
      position: absolute; inset: 0;
      /* 夕陽暖棕色漸層 */
      background: linear-gradient(to top, rgba(67, 36, 22, 0.95) 0%, rgba(67, 36, 22, 0.2) 60%);
    }
    .hero-content { position: absolute; bottom: 24px; left: 24px; right: 24px; color: white; }
    .hero-badge {
      display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(8px);
      padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .hero h1 { font-size: 1.6rem; font-weight: 800; margin: 0 0 4px 0; line-height: 1.3; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .hero p { margin: 0; font-size: 0.85rem; opacity: 0.9; }

    /* 主內容區 */
    .container { max-width: 600px; margin: 0 auto; padding: 20px 20px 0; }

    /* 警告/任務提示卡 - 銀杏黃 */
    .alert-card {
      background: linear-gradient(135deg, #fefce8 0%, #fef08a 100%);
      border: 1px solid #fde047; border-radius: var(--radius-md);
      padding: 16px; margin-bottom: 24px; display: flex; gap: 12px;
      box-shadow: 0 4px 12px rgba(202, 138, 4, 0.1);
    }
    .alert-icon { font-size: 1.5rem; color: #a16207; }
    .alert-text { font-size: 0.85rem; color: #713f12; line-height: 1.5; }
    .alert-text b { color: #854d0e; }

    /* =========================================
       模式 A：互動式時間軸 (Day 1 - Day 5)
       ========================================= */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
      content: ''; position: absolute; top: 0; bottom: 0; left: 10px;
      width: 2px; background: #e7e5e4; border-radius: 2px;
    }
    .t-item { position: relative; margin-bottom: 20px; opacity: 0; transform: translateY(15px); animation: fadeInUp 0.4s forwards; }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .t-dot {
      position: absolute; left: -23px; top: 20px; width: 12px; height: 12px;
      border-radius: 50%; background: white; border: 3px solid var(--primary); z-index: 2;
    }
    .t-card {
      background: var(--surface); border-radius: var(--radius-md); padding: 16px;
      box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.1); cursor: pointer; transition: all 0.25s ease;
      border: 1px solid transparent; overflow: hidden;
    }
    .t-card:active { transform: scale(0.98); }
    .t-card.task { border-color: #fca5a5; box-shadow: 0 4px 15px -3px rgba(239, 68, 68, 0.15); }
    
    .t-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .t-time { font-size: 1.1rem; font-weight: 800; color: var(--primary); font-family: 'Plus Jakarta Sans', sans-serif; min-width: 50px; white-space: nowrap; }
    .t-title-area { flex: 1; margin-left: 12px; }
    .t-title { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
    .t-subtitle { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; }
    .t-icon {
      width: 32px; height: 32px; border-radius: 10px; background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
    }

    .t-details { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    .t-card.expanded .t-details { max-height: 800px; opacity: 1; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }

    /* =========================================
       模式 B：專屬清單 (購物/美妝)
       ========================================= */
    .add-btn-wrap { margin-bottom: 16px; }
    .add-btn {
      width: 100%; background: #fafaf9; border: 2px dashed #d6d3d1; color: #57534e;
      padding: 14px; border-radius: var(--radius-md); font-size: 0.95rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.2s;
    }
    .add-btn:active { background: #e7e5e4; transform: scale(0.98); }

    .shopping-grid { display: flex; flex-direction: column; gap: 16px; }
    .shop-card {
      background: var(--surface); border-radius: var(--radius-md); padding: 18px; position: relative;
      box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.1); opacity: 0; transform: translateY(15px); animation: fadeInUp 0.4s forwards;
    }
    
    /* 秋季伴手禮主題 (橘黃) */
    .shop-card.buy-theme { border: 1px solid #fde047; box-shadow: 0 4px 15px -3px rgba(202, 138, 4, 0.1); }
    /* 秋季芒草美妝主題 (玫瑰粉) */
    .shop-card.beauty-theme { border: 1px solid #fbcfe8; box-shadow: 0 4px 15px -3px rgba(219, 39, 119, 0.1); }

    .shop-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px dashed var(--border); }
    .shop-icon {
      width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; flex-shrink: 0;
    }
    .buy-theme .shop-icon { background: #fefce8; color: #a16207; }
    .beauty-theme .shop-icon { background: #fdf2f8; color: #be185d; }

    .shop-title-area { flex: 1; }
    .shop-category { font-size: 0.8rem; font-weight: 800; margin-bottom: 2px; }
    .buy-theme .shop-category { color: #a16207; }
    .beauty-theme .shop-category { color: #be185d; }
    .shop-title { font-size: 1rem; font-weight: 700; color: var(--text); }
    .shop-content { font-size: 0.88rem; color: #44403c; line-height: 1.65; white-space: pre-wrap;}
    .shop-content b { color: #1c1917; }

    .delete-btn {
      position: absolute; top: 18px; right: 18px; background: #fee2e2; color: #ef4444; border: none;
      width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 1rem; cursor: pointer; transition: 0.2s;
    }
    .delete-btn:active { transform: scale(0.9); }
    
    /* 展開圖片與按鈕通用 */
    .d-img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; background-color: #e7e5e4; }
    .d-text { font-size: 0.85rem; color: #44403c; line-height: 1.6; margin-bottom: 12px; }
    .btn-group { display: flex; gap: 8px; }
    .btn {
      flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; padding: 10px; border-radius: 10px;
      font-size: 0.8rem; font-weight: 600; border: none; cursor: pointer; text-decoration: none; transition: background 0.2s;
    }
    .btn-copy { background: #f5f5f4; color: #44403c; border: 1px solid #d6d3d1; }
    .btn-copy:active { background: #e7e5e4; }
    .btn-map { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .btn-map:active { background: #d1fae5; }

    /* App 底部導航 */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.05);
      display: flex; justify-content: space-between; padding: 10px 8px 22px; z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text-muted); cursor: pointer; flex: 1; transition: color 0.3s;
    }
    .nav-item i { font-size: 1.3rem; transition: transform 0.3s; }
    .nav-item span { font-size: 0.6rem; font-weight: 700; }
    .nav-item.active { color: var(--primary); }
    .nav-item.active i { font-weight: bold; transform: translateY(-2px); }
    .nav-item.active.shopping-tab { color: #a16207; } /* 購物清單秋橘色 */
    .nav-item.active.beauty-tab { color: #be185d; }   /* 美妝芒草粉色 */

    /* 表單 Modal */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(41, 37, 36, 0.6); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: flex-end; z-index: 200;
    }
    .modal-bg.show { display: flex; }
    .modal-box {
      background: white; width: 100%; max-width: 520px; border-radius: 24px 24px 0 0; padding: 20px 20px 34px;
      transform: translateY(100%); animation: slideUp 0.3s forwards;
    }
    @keyframes slideUp { to { transform: translateY(0); } }
    .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-top h3 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 6px; color: var(--text); }
    .close-btn { font-size: 1.5rem; background: none; border: none; cursor: pointer; color: var(--text-muted); }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 0.95rem; font-family: inherit; background: #fafaf9; color: var(--text);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .submit-btn {
      width: 100%; padding: 14px; background: var(--primary); color: white;
      border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px;
    }
    .submit-btn.beauty-btn { background: #be185d; }
    .submit-btn.buy-btn { background: #a16207; }

    #toast {
      position: fixed; top: 40px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: rgba(41, 37, 36, 0.95); color: white; padding: 12px 24px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px;
      opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  </style>
</head>
<body>

  <!-- 動態封面區 -->
  <header class="hero">
    <img src="https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=1000&q=80" class="hero-img active" id="heroImg">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-badge" id="heroBadge">🍂 10/10 (六)</div>
      <h1 id="heroTitle">廣安里海景與無人機秀</h1>
      <p id="heroDesc">廣安里無人機秀 • 豬肉湯飯 • 抵達釜山</p>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="container">
    <div id="alertBox" class="alert-card"></div>
    <div id="contentArea"></div>
  </main>

  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('d1')" id="nav-d1"><i class="ph ph-airplane-landing"></i><span>D1</span></div>
    <div class="nav-item" onclick="switchTab('d2')" id="nav-d2"><i class="ph ph-palette"></i><span>D2</span></div>
    <div class="nav-item" onclick="switchTab('d3')" id="nav-d3"><i class="ph ph-waves"></i><span>D3</span></div>
    <div class="nav-item" onclick="switchTab('d4')" id="nav-d4"><i class="ph ph-leaf"></i><span>D4</span></div>
    <div class="nav-item" onclick="switchTab('d5')" id="nav-d5"><i class="ph ph-crab"></i><span>D5</span></div>
    <div class="nav-item shopping-tab" onclick="switchTab('buy')" id="nav-buy"><i class="ph ph-shopping-bag-open"></i><span>必買</span></div>
    <div class="nav-item beauty-tab" onclick="switchTab('beauty')" id="nav-beauty"><i class="ph ph-sparkle"></i><span>美妝</span></div>
  </nav>

  <!-- 新增項目的表單彈窗 -->
  <div class="modal-bg" id="addModal" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-top">
        <h3 id="modalTitle"><i class="ph-bold ph-plus-circle"></i> 新增專屬清單</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="form-group">
        <label>自訂分類標籤 (如：免稅店、包包、小吃)</label>
        <input type="text" id="customCategory" placeholder="輸入分類，預設為「我的清單」">
      </div>
      <div class="form-group">
        <label>物品/店鋪名稱 *</label>
        <input type="text" id="customTitle" placeholder="想買什麼？" required>
      </div>
      <div class="form-group">
        <label>備註細節 (可選)</label>
        <textarea id="customDesc" placeholder="記錄價錢、尺寸、色號或朋友託買資訊..."></textarea>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="saveCustomItem()">儲存至清單</button>
    </div>
  </div>

  <div id="toast"><i class="ph-fill ph-check-circle"></i><span id="toastMsg">已複製</span></div>

      let html = `<div class="timeline">`;
      data.items.forEach((item, index) => {
        const typeCfg = typeMap[item.type] || typeMap.traffic;
        const isTask = item.type === 'task' ? 'task' : '';
        const hasDetails = item.img || item.kr || item.map || item.desc;

        html += `
          <div class="t-item" style="animation-delay: ${index * 0.08}s">
            <div class="t-dot" style="border-color: ${typeCfg.color}"></div>
            <div class="t-card ${isTask}" ${hasDetails ? 'onclick="toggleCard(this)"' : ''}>
              <div class="t-header">
                <div class="t-time" style="color: ${typeCfg.color}">${item.time}</div>
                <div class="t-title-area">
                  <div class="t-title">${item.title}</div>
                  <div class="t-subtitle">${item.sub}</div>
                </div>
                <div class="t-icon" style="background:${typeCfg.bg}; color:${typeCfg.color}"><i class="ph-bold ${item.icon}"></i></div>
              </div>
        `;
        if (hasDetails) {
          html += `<div class="t-details" onclick="event.stopPropagation()">`;
          if (item.img) html += `<img src="${item.img}" class="d-img" alt="實景圖" loading="lazy">`;
          if (item.desc) html += `<div class="d-text">${item.desc}</div>`;
          if (item.kr || item.map) {
            html += `<div class="btn-group">`;
            if (item.kr) html += `<button class="btn btn-copy" onclick="copyText('${item.kr}')"><i class="ph ph-copy"></i> ${item.kr}</button>`;
            if (item.map) html += `<a href="${item.map}" target="_blank" class="btn btn-map"><i class="ph-fill ph-map-pin"></i> NAVER 導航</a>`;
            html += `</div>`;
          }
          html += `</div>`;
        }
        html += `</div></div>`;
      });
      html += `</div>`;
      contentArea.innerHTML = html;
    } 
    
    // ======== B. 專屬購物清單模式 ========
    else if (data.type === 'shopping') {
      const themeClass = data.theme === 'beauty' ? 'beauty-theme' : 'buy-theme';
      const btnTheme = data.theme === 'beauty' ? 'beauty-btn' : 'buy-btn';
      
      let html = `<div class="shopping-grid">`;

      // 頂部新增按鈕
      html += `
        <div class="add-btn-wrap">
          <button class="add-btn" onclick="openModal('${data.theme}')">
            <i class="ph-bold ph-plus"></i> 新增自訂${data.theme === 'beauty' ? '美妝' : '伴手禮'}清單
          </button>
        </div>
      `;
      
      // 1. 渲染系統預設清單
      data.items.forEach((item, index) => {
        html += `
          <div class="shop-card ${themeClass}" style="animation-delay: ${index * 0.08}s">
            <div class="shop-header">
              <div class="shop-title-area">
                <div class="shop-category">${item.category}</div>
                <div class="shop-title">${item.title}</div>
              </div>
              <div class="shop-icon"><i class="ph-fill ${item.icon}"></i></div>
            </div>
            <div class="shop-content">${item.desc}</div>
          </div>
        `;
      });

      // 2. 渲染使用者自訂新增的清單
      const filteredCustoms = customItems.filter(ci => ci.tab === data.theme);
      filteredCustoms.forEach(item => {
        html += `
          <div class="shop-card ${themeClass}" style="animation: none; opacity: 1; transform: translateY(0);">
            <button class="delete-btn" onclick="deleteCustom(${item.id})"><i class="ph-bold ph-trash"></i></button>
            <div class="shop-header">
              <div class="shop-title-area">
                <div class="shop-category">${item.category}</div>
                <div class="shop-title">${item.title}</div>
              </div>
              <div class="shop-icon"><i class="ph-fill ph-star"></i></div>
            </div>
            <div class="shop-content">${item.desc}</div>
          </div>
        `;
      });

      html += `</div>`;
      contentArea.innerHTML = html;
      
      // 動態更改 Modal 按鈕顏色
      document.getElementById('submitBtn').className = 'submit-btn ' + btnTheme;
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function toggleCard(el) {
    const isExpanded = el.classList.contains('expanded');
    if (!isExpanded) el.classList.add('expanded');
    else el.classList.remove('expanded');
  }

  // ==== 自訂清單 CRUD 邏輯 ====
  let currentTargetTab = '';
  
  function openModal(themeTab) {
    currentTargetTab = themeTab;
    document.getElementById('customCategory').value = '';
    document.getElementById('customTitle').value = '';
    document.getElementById('customDesc').value = '';
    document.getElementById('addModal').classList.add('show');
  }

  function closeModal(e) {
    document.getElementById('addModal').classList.remove('show');
  }

  function saveCustomItem() {
    const category = document.getElementById('customCategory').value.trim() || '我的清單';
    const title = document.getElementById('customTitle').value.trim();
    const desc = document.getElementById('customDesc').value.trim();

    if(!title) {
      alert("請輸入想買的物品名稱！");
      return;
    }

    const newItem = {
      id: Date.now(),
      tab: currentTargetTab,
      category: category,
      title: title,
      desc: desc
    };

    customItems.push(newItem);
    localStorage.setItem('busan_custom_items', JSON.stringify(customItems));
    
    closeModal();
    // 強制重新渲染當前頁面
    currentTab = ''; 
    switchTab(currentTargetTab);
  }

  function deleteCustom(id) {
    if(confirm('確定要從清單中刪除這個好物嗎？')) {
      customItems = customItems.filter(item => item.id !== id);
      localStorage.setItem('busan_custom_items', JSON.stringify(customItems));
      // 強制重新渲染當前頁面
      const tempTab = currentTab;
      currentTab = ''; 
      switchTab(tempTab);
    }
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = `已複製：${text}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });
  }

  window.onload = () => switchTab('d1');
</script>
</body>
</html>
