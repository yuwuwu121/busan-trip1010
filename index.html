<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>釜山慶州 5D4N 秋季自由行</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      --primary: #c2410c;       
      --primary-light: #ffedd5; 
      --accent: #b45309;        
      --bg: #faf6f0;            
      --surface: #ffffff;
      --text: #292524;          
      --text-muted: #78716c;    
      --border: #e7e5e4;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      margin: 0; background-color: var(--bg); color: var(--text); overflow: hidden;
    }

    /* ================= 啟動封面 (Splash Cover) ================= */
    .cover-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(180deg, rgba(67, 36, 22, 0.25) 0%, rgba(67, 36, 22, 0.95) 100%),
                  url('https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=1200&q=80') center/cover;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 40px 24px 80px; transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s;
    }
    .cover-screen.hide { transform: translateY(-100%); opacity: 0; pointer-events: none; }
    .cover-title { color: white; text-align: center; margin-bottom: 50px; }
    .cover-title h1 { font-size: 3rem; font-weight: 900; margin: 0 0 10px; letter-spacing: 4px; font-family: 'Plus Jakarta Sans', sans-serif;}
    .cover-title p { font-size: 1.15rem; opacity: 0.95; margin: 0; font-weight: 700; letter-spacing: 1px;}
    .cover-btn {
      background: var(--surface); color: var(--primary);
      border: none; border-radius: 999px; padding: 18px 45px;
      font-size: 1.15rem; font-weight: 800; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); cursor: pointer; transition: 0.2s;
    }
    .cover-btn:active { transform: scale(0.95); }

    /* ================= 螢幕堆疊系統 ================= */
    .screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg); overflow-y: auto; overflow-x: hidden;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); z-index: 10;
    }
    #screen-home { z-index: 1; transform: translateX(0); padding-bottom: 100px; }
    #screen-list { z-index: 2; transform: translateX(100%); background-color: var(--bg); padding-bottom: 100px;}
    #screen-detail { z-index: 3; transform: translateX(100%); background-color: var(--surface); padding-bottom: 100px;}
    .screen.active { transform: translateX(0) !important; }

    /* ================= 首頁設計 ================= */
    .hero {
      position: relative; height: 260px;
      background: linear-gradient(180deg, rgba(67, 36, 22, 0.4) 0%, rgba(67, 36, 22, 0.9) 100%), 
                  url('https://images.unsplash.com/photo-1548115184-bc6544d06a58?auto=format&fit=crop&w=1200&q=80') center/cover;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; color: white;
      border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg);
      box-shadow: 0 10px 30px rgba(194, 65, 12, 0.15);
    }
    .hero-badge {
      display: inline-block; background: rgba(255,255,255,0.25); backdrop-filter: blur(8px);
      padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px;
    }
    .hero h1 { font-size: 1.7rem; font-weight: 800; margin: 0 0 4px 0; }
    .hero p { margin: 0; font-size: 0.9rem; opacity: 0.9; }

    .section-title { font-size: 1.1rem; font-weight: 800; color: var(--text); margin: 24px 20px 12px; display: flex; align-items: center; gap: 8px; }
    .home-menu { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 12px; }
    .menu-card {
      background: var(--surface); border-radius: var(--radius-md); padding: 18px;
      display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.1); cursor: pointer; transition: 0.2s;
    }
    .menu-card:active { transform: scale(0.98); background: #f5f5f4; }
    .menu-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
    .menu-info { flex: 1; }
    .menu-date { font-size: 0.75rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .menu-title { font-size: 1.05rem; font-weight: 800; color: var(--text); }
    .menu-arrow { color: #a8a29e; font-size: 1.2rem; }

    .menu-card.buy .menu-icon { background: #fefce8; color: #a16207; }
    .menu-card.buy .menu-date { color: #a16207; }
    .menu-card.beauty .menu-icon { background: #fdf2f8; color: #be185d; }
    .menu-card.beauty .menu-date { color: #be185d; }

    /* ================= 列表頁 ================= */
    .header-bar {
      position: sticky; top: 0; z-index: 50; background: rgba(250, 246, 240, 0.85); backdrop-filter: blur(16px);
      padding: 16px 20px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px;
    }
    .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; }
    .back-btn:active { background: #e7e5e4; }
    .header-title { font-size: 1.15rem; font-weight: 800; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-container { padding: 20px; }

    .alert-card {
      background: linear-gradient(135deg, #fefce8 0%, #fef08a 100%); border: 1px solid #fde047; border-radius: var(--radius-md);
      padding: 16px; margin-bottom: 24px; display: flex; gap: 12px; box-shadow: 0 4px 12px rgba(202, 138, 4, 0.1);
    }
    .alert-icon { font-size: 1.5rem; color: #a16207; }
    .alert-text { font-size: 0.85rem; color: #713f12; line-height: 1.5; }
    .alert-text b { color: #854d0e; }

    .timeline { position: relative; padding-left: 28px; }
    .timeline::before { content: ''; position: absolute; top: 20px; bottom: 20px; left: 10px; width: 2px; background: #e7e5e4; border-radius: 2px; }
    .t-item { position: relative; margin-bottom: 16px; opacity: 0; transform: translateY(15px); animation: fadeInUp 0.4s forwards; }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .t-dot { position: absolute; left: -23px; top: 24px; width: 12px; height: 12px; border-radius: 50%; background: white; border: 3px solid var(--primary); z-index: 2; }
    .t-card { background: var(--surface); border-radius: var(--radius-md); padding: 16px; box-shadow: 0 4px 15px -3px rgba(120, 113, 108, 0.08); cursor: pointer; display: flex; align-items: center; gap: 12px; border: 1px solid transparent; }
    .t-card:active { transform: scale(0.98); }
    .t-card.task { border-color: #fca5a5; box-shadow: 0 4px 15px -3px rgba(239, 68, 68, 0.15); }
    .t-time { font-size: 0.95rem; font-weight: 800; color: var(--primary); width: 45px; flex-shrink: 0; }
    .t-info { flex: 1; }
    .t-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
    .t-sub { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
    .t-card i.arrow { color: #d6d3d1; font-size: 1.2rem; }

    /* ================= 詳情頁 ================= */
    .detail-cover { width: 100%; height: 300px; object-fit: cover; background: #e7e5e4; }
    .detail-body { padding: 24px; background: var(--surface); border-top-left-radius: 24px; border-top-right-radius: 24px; margin-top: -24px; position: relative; z-index: 5; min-height: calc(100vh - 276px); }
    .d-tag { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; margin-bottom: 12px; }
    .d-title { font-size: 1.5rem; font-weight: 800; margin: 0 0 16px 0; line-height: 1.3; }
    .d-desc { font-size: 0.95rem; color: #44403c; line-height: 1.7; margin-bottom: 24px; white-space: pre-line; }
    
    .action-row { display: flex; flex-direction: column; gap: 12px; margin-top: auto; padding-bottom: 40px; }
    .btn-large { width: 100%; padding: 16px; border-radius: 14px; font-size: 1rem; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; border: none; cursor: pointer; text-decoration: none; }
    .btn-nav { background: #047857; color: white; box-shadow: 0 4px 15px rgba(4, 120, 87, 0.3); }
    .btn-nav:active { background: #065f46; }
    .btn-cp { background: #f5f5f4; color: #44403c; border: 1px solid #d6d3d1; }
    .btn-cp:active { background: #e7e5e4; }

    #toast { position: fixed; top: 40px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(41, 37, 36, 0.95); color: white; padding: 12px 24px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 999; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- ================= 啟動封面 ================= -->
  <div id="screen-cover" class="cover-screen">
    <div class="cover-title">
      <h1>BUSAN</h1>
      <p>釜山 ✕ 慶州 秋季旅行</p>
      <p style="font-size:0.9rem; opacity:0.8; margin-top:8px; font-weight: 600;">2026.10.10 - 10.14</p>
    </div>
    <button class="cover-btn" onclick="enterApp()">
      翻開手冊 <i class="ph-bold ph-arrow-right"></i>
    </button>
  </div>

  <!-- ================= 首頁 ================= -->
  <div id="screen-home" class="screen active">
    <header class="hero">
      <div class="hero-badge">🍁 釜山 ✕ 慶州</div>

    </header>

    <div class="section-title"><i class="ph-bold ph-calendar-check"></i> 行程總覽</div>
    <div class="home-menu">
      <div class="menu-card" onclick="openList('d1')">
        <div class="menu-icon"><i class="ph-fill ph-airplane-landing"></i></div>

      <div class="menu-card" onclick="openList('d2')">

        <div class="menu-info"><div class="menu-date">10/11 (日)</div><div class="menu-title">傳統市場與光影展</div></div>
        <i class="ph-bold ph-caret-right menu-arrow"></i>
      </div>
      <div class="menu-card" onclick="openList('d3')">
        <div class="menu-icon"><i class="ph-fill ph-waves"></i></div>
        <div class="menu-info"><div class="menu-date">10/12 (一)</div><div class="menu-title">冬柏海景與尾浦散策</div></div>
        <i class="ph-bold ph-caret-right menu-arrow"></i>
      </div>
      <div class="menu-card" onclick="openList('d4')">
        <div class="menu-icon"><i class="ph-fill ph-leaf"></i></div>
        <div class="menu-info"><div class="menu-date">10/13 (二)</div><div class="menu-title">慶州千年古都與花海</div></div>
        <i class="ph-bold ph-caret-right menu-arrow"></i>
      </div>
      <div class="menu-card" onclick="openList('d5')">
        <div class="menu-icon"><i class="ph-fill ph-crab"></i></div>
        <div class="menu-info"><div class="menu-date">10/14 (三)</div><div class="menu-title">松葉蟹與披薩大滿貫</div></div>
        <i class="ph-bold ph-caret-right menu-arrow"></i>
      </div>
    </div>

    <div class="section-title"><i class="ph-bold ph-shopping-bag-open"></i> 專屬清單</div>
    <div class="home-menu">
      <div class="menu-card buy" onclick="openList('buy')">
        <div class="menu-icon"><i class="ph-fill ph-gift"></i></div>
        <div class="menu-info"><div class="menu-date">超市與特產攻略</div><div class="menu-title">必買伴手禮清單</div></div>
        <i class="ph-bold ph-caret-right menu-arrow"></i>
      </div>
      <div class="menu-card beauty" onclick="openList('beauty')">
        <div class="menu-icon"><i class="ph-fill ph-sparkle"></i></div>
        <div class="menu-info"><div class="menu-date">Olive Young 掃貨</div><div class="menu-title">美妝與保養攻略</div></div>
        <i class="ph-bold ph-caret-right menu-arrow"></i>
      </div>
    </div>
  </div>

  <!-- ================= 列表頁 ================= -->
  <div id="screen-list" class="screen">
    <div class="header-bar">
      <div class="back-btn" onclick="backToHome()"><i class="ph-bold ph-arrow-left"></i></div>
      <h2 class="header-title" id="list-header-title">Day 1</h2>
    </div>
    <div class="list-container">
      <div id="listAlert" class="alert-card" style="display:none;"></div>
      <div id="listContent" class="timeline"></div>
    </div>
  </div>

  <!-- ================= 詳情頁 ================= -->
  <div id="screen-detail" class="screen">
    <div class="header-bar" style="position: absolute; background: transparent; border: none;">
      <div class="back-btn" onclick="backToList()"><i class="ph-bold ph-arrow-left"></i></div>
    </div>
    <img id="detail-img" class="detail-cover" src="" alt="Cover">
    <div class="detail-body">
      <div id="detail-tag" class="d-tag">標籤</div>
      <h2 id="detail-title" class="d-title">標題</h2>
      <div id="detail-desc" class="d-desc">內容介紹</div>
      <div id="detail-actions" class="action-row"></div>
    </div>
  </div>

  <div id="toast"><i class="ph-fill ph-check-circle"></i><span id="toastMsg">已複製</span></div>

        { time: "保養", title: "清潔與修護", sub: "混合偏油肌精選清單", type: "shop", desc: "• <b>洗面乳：</b>Arenchia 綠茶年糕潔面、Torhop 黑鹽潔顏乳（這兩款深層清潔非常適合你的混合偏油肌）\n• <b>防曬/精華：</b>Skin1004 防曬（清爽不油膩），並順便補貨 The Ordinary 煙鹼醯胺 10%+鋅 1% 精華 與 s.nature 角鯊霜。" },
        { time: "彩妝", title: "冷調彩妝補貨", sub: "底妝與冷調橄欖肌必備", type: "shop", desc: "• <b>底妝：</b>KATE 零瑕肌密粉底液 <b>（記得妳是用 00 亮白色號！）</b> 還有 KATE 蜜粉液。\n• <b>眼妝：</b>Clio 聯名眼影盤（哈利波特款）、CANMAKE 臥蠶打亮筆。\n• <b>唇彩：</b>挑選最適合你「冷調橄欖肌」的紫粉/冷色調唇釉。" },
        { time: "送禮", title: "男友專屬代買", sub: "男士懶人保養推薦", type: "task", desc: "• <b>底妝：</b>順手幫男友帶一條 Obge 男士素顏霜，方便他快速出門！\n• <b>保養：</b>挑一瓶男性專用的清爽型 All-in-One 化妝水。" }
      ]
    }
  };

  /* 顏色設定 */
  const typeMap = {
    food: { color: '#c2410c', bg: '#ffedd5', label: '美食' },
    spot: { color: '#b45309', bg: '#fef3c7', label: '景點' },
    task: { color: '#be123c', bg: '#ffe4e6', label: '重要' },
    shop: { color: '#854d0e', bg: '#fef08a', label: '購物' },
    traffic: { color: '#78716c', bg: '#f5f5f4', label: '交通' },
    hotel: { color: '#9a3412', bg: '#ffedd5', label: '住宿' }
  };

  // ================= 導航邏輯 =================
  let currentListId = '';

  function enterApp() {
    document.getElementById('screen-cover').classList.add('hide');
  }

  function openList(id) {
    currentListId = id;
    const data = db[id];
    document.getElementById('list-header-title').innerText = data.title;
    const alertBox = document.getElementById('listAlert');
    if (data.alert) { alertBox.style.display = 'flex'; alertBox.innerHTML = `<i class="ph-fill ph-warning-circle alert-icon"></i><div class="alert-text">${data.alert}</div>`; } 
    else { alertBox.style.display = 'none'; }

    const container = document.getElementById('listContent');
    container.innerHTML = '';
    
    data.items.forEach((item, index) => {
      const typeCfg = typeMap[item.type] || typeMap.traffic;
      const isTask = item.type === 'task' ? 'task' : '';
      const clickable = (item.img || item.desc || item.kr || item.map) ? `onclick="openDetail('${id}',${index})"` : '';
      const arrowIcon = clickable ? `<i class="ph-bold ph-caret-right arrow"></i>` : ``;

      const html = `
        <div class="t-item" style="animation-delay: ${index * 0.05}s">
          <div class="t-dot" style="border-color: ${typeCfg.color}"></div>
          <div class="t-card ${isTask}" ${clickable}>
            <div class="t-time" style="color: ${typeCfg.color}">${item.time}</div>
            <div class="t-info"><div class="t-title">${item.title}</div><div class="t-sub">${item.sub}</div></div>
            ${arrowIcon}
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', html);
    });

    document.getElementById('screen-list').classList.add('active');
    document.getElementById('screen-list').scrollTo(0,0);
  }

  function openDetail(dayId, itemIndex) {
    const item = db[dayId].items[itemIndex];
    const typeCfg = typeMap[item.type] || typeMap.traffic;

    const imgEl = document.getElementById('detail-img');
    if(item.img) { imgEl.src = item.img; imgEl.style.display = 'block'; } else { imgEl.style.display = 'none'; }

    const tagEl = document.getElementById('detail-tag');
    tagEl.innerText = typeCfg.label; tagEl.style.backgroundColor = typeCfg.bg; tagEl.style.color = typeCfg.color;

    document.getElementById('detail-title').innerText = item.title;
    document.getElementById('detail-desc').innerHTML = item.desc || '';

    const actionsBox = document.getElementById('detail-actions');
    actionsBox.innerHTML = '';
    if(item.map) actionsBox.innerHTML += `<a href="${item.map}" target="_blank" class="btn-large btn-nav"><i class="ph-fill ph-map-pin"></i> 開啟 NAVER 導航</a>`;
    if(item.kr) actionsBox.innerHTML += `<button class="btn-large btn-cp" onclick="copyText('${item.kr}')"><i class="ph-bold ph-copy"></i> 複製韓文：${item.kr}</button>`;

    document.getElementById('screen-detail').classList.add('active');
    document.getElementById('screen-detail').scrollTo(0,0);
  }

  function backToHome() { document.getElementById('screen-list').classList.remove('active'); }
  function backToList() { document.getElementById('screen-detail').classList.remove('active'); }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = `已複製：${text}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });
  }
</script>
</body>
</html>
